[project]
name = "dml-open-platform-mcp"
version = "1.0.0"
description = "DML V4 开放平台 MCP 服务（独立进程）"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28.1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "loguru>=0.7.3",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "asgi-lifespan>=2.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

services:
  open-platform-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dml-open-platform-gateway:local
    container_name: dml-open-platform-gateway
    restart: unless-stopped
    ports:
      - "8820:8820"
    environment:
      DML_GATEWAY_HOST: 0.0.0.0
      DML_GATEWAY_PORT: 8820
      DML_GATEWAY_UPSTREAMS: ${DML_GATEWAY_UPSTREAMS:-http://host.docker.internal:8801}
      DML_GATEWAY_CORS_ORIGINS: ${DML_GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8808,http://127.0.0.1:8808,http://localhost:8809,http://127.0.0.1:8809}
      DML_GATEWAY_CONSOLE_TOKEN: ${DML_GATEWAY_CONSOLE_TOKEN:-dev-console-token}
      DML_GATEWAY_UPSTREAM_AUTH_SECRET: ${DML_GATEWAY_UPSTREAM_AUTH_SECRET:-dev-open-platform-gateway-secret-change-me}
      DML_GATEWAY_UPSTREAM_AUTH_ISSUER: ${DML_GATEWAY_UPSTREAM_AUTH_ISSUER:-dml-open-platform}
      DML_GATEWAY_UPSTREAM_AUTH_AUDIENCE: ${DML_GATEWAY_UPSTREAM_AUTH_AUDIENCE:-dml-backend}
      DML_GATEWAY_UPSTREAM_AUTH_TTL_SECONDS: ${DML_GATEWAY_UPSTREAM_AUTH_TTL_SECONDS:-300}
      DML_GATEWAY_LOG_LEVEL: ${DML_GATEWAY_LOG_LEVEL:-INFO}
      DML_GATEWAY_DB_PATH: /data/gateway.db
    volumes:
      - open-platform-gateway-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8820/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-platform-mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dml-open-platform-gateway:local
    container_name: dml-open-platform-mcp
    restart: unless-stopped
    ports:
      - "8810:8810"
    environment:
      DML_MCP_TRANSPORT: streamable-http
      DML_MCP_HOST: 0.0.0.0
      DML_MCP_PORT: 8810
      DML_MCP_PATH: /mcp
      DML_MCP_API_KEY: ${DML_MCP_API_KEY:-dml_test_demo_local}
      DML_GATEWAY_UPSTREAMS: ${DML_GATEWAY_UPSTREAMS:-http://host.docker.internal:8801}
      DML_GATEWAY_DB_PATH: /data/gateway.db
      DML_GATEWAY_UPSTREAM_AUTH_SECRET: ${DML_GATEWAY_UPSTREAM_AUTH_SECRET:-dev-open-platform-gateway-secret-change-me}
      DML_GATEWAY_UPSTREAM_AUTH_ISSUER: ${DML_GATEWAY_UPSTREAM_AUTH_ISSUER:-dml-open-platform}
      DML_GATEWAY_UPSTREAM_AUTH_AUDIENCE: ${DML_GATEWAY_UPSTREAM_AUTH_AUDIENCE:-dml-backend}
      DML_GATEWAY_UPSTREAM_AUTH_TTL_SECONDS: ${DML_GATEWAY_UPSTREAM_AUTH_TTL_SECONDS:-300}
      DML_GATEWAY_LOG_LEVEL: ${DML_GATEWAY_LOG_LEVEL:-INFO}
    volumes:
      - open-platform-gateway-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - -m
      - mcp_server.server
    depends_on:
      open-platform-gateway:
        condition: service_healthy

volumes:
  open-platform-gateway-data:
